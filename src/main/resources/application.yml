server:
  port: 8084

spring:
  application:
    name: sales-service
  datasource:
    url: jdbc:postgresql://host.docker.internal:5432/erp_sales
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

eureka:
  instance:
    prefer-ip-address: true
    appname: sales-service
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://eureka-server:8761/eureka/  

management:
  endpoints:
    web:
      exposure:
        include: "*"

# Penambahan konfigurasi logging untuk melacak request controller
logging:
  level:
    org.springframework.web: DEBUG
    com.kencana.salesservice: DEBUG